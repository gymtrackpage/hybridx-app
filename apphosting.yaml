# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
env:
  # Public variables (not secret)
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://app.hybridx.club"
  - variable: NEXT_PUBLIC_STRAVA_CLIENT_ID
    value: "12008"
  - variable: STRIPE_PRICE_ID
    value: "price_1S3Ki6GKLIEfAkDGEKkK9IIN"
  - variable: EMAIL_FROM
    value: "training@hybridx.club"
  - variable: EMAIL_FROM_NAME
    value: "HybridX Training"

  # Marketing sender. Kept separate from the transactional address above so a
  # campaign that draws spam complaints cannot damage delivery of verification
  # and coaching email — the failure mode there is invisible until somebody
  # cannot sign in.
  #
  # BEFORE CHANGING THIS VALUE, in Brevo:
  #   1. Add mail.hybridx.club as a sending domain.
  #   2. Publish the SPF, DKIM and Return-Path records it gives you.
  #   3. Add a DMARC record on the subdomain, starting permissive:
  #        _dmarc.mail.hybridx.club  TXT  "v=DMARC1; p=none; rua=mailto:training@hybridx.club"
  #   4. Wait for Brevo to report the domain verified.
  #   5. Warm it: a few hundred of your most engaged subscribers first, growing
  #      over a fortnight. A cold subdomain sending thousands on day one is
  #      indistinguishable from a spammer, because that is what spammers do.
  #
  # Until step 4 is done this must stay on the verified address, or every
  # campaign fails authentication. The settings health panel reports whether
  # bulk and transactional are still sharing one address.
  - variable: MARKETING_EMAIL_FROM
    value: "training@hybridx.club"
  - variable: MARKETING_EMAIL_FROM_NAME
    value: "HYBRIDX"
  # Where the weekly marketing brief is sent. Falls back to EMAIL_FROM.
  - variable: MARKETING_BRIEF_RECIPIENT
    value: "training@hybridx.club"

  # Secrets (stored in Google Secret Manager)
  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: FIREBASE_SERVICE_ACCOUNT_KEY
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
  - variable: STRAVA_CLIENT_SECRET
    secret: STRAVA_CLIENT_SECRET
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: CRON_SECRET
    secret: CRON_SECRET
  - variable: GMAIL_USER
    secret: GMAIL_USER
  - variable: GMAIL_APP_PASSWORD
    secret: GMAIL_APP_PASSWORD
  - variable: GARMIN_CLIENT_ID
    secret: GARMIN_CLIENT_ID
  - variable: GARMIN_CLIENT_SECRET
    secret: GARMIN_CLIENT_SECRET
  - variable: BREVO_SMTP_USER
    secret: BREVO_SMTP_USER
  - variable: BREVO_SMTP_KEY
    secret: BREVO_SMTP_KEY
  # Signs unsubscribe and tracking links. Must be at least 32 characters;
  # marketing sends fail closed without it rather than emitting forgeable links.
  - variable: MARKETING_TOKEN_SECRET
    secret: MARKETING_TOKEN_SECRET
  # Shared secret for Brevo's delivery webhook. Without it the endpoint rejects
  # every request, so bounces and complaints would go unrecorded.
  - variable: BREVO_WEBHOOK_SECRET
    secret: BREVO_WEBHOOK_SECRET
  # Server-to-server credential for hybridx.club (the marketing site) to push
  # captured leads in and check the shared suppression list. Deliberately not
  # CRON_SECRET: the marketing site should not hold a credential that also
  # unlocks the send cron. Minimum 32 characters; unset fails closed.
  - variable: LEAD_BRIDGE_SECRET
    secret: LEAD_BRIDGE_SECRET
